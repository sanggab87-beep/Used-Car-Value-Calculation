<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>티니핑 어드벤처: 거울의 성</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap" />
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;}
  body{background:#100a20;color:#fff;font-family:"Noto Sans KR",system-ui,sans-serif;
    display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:none;user-select:none;}
  #wrap{position:relative;display:flex;flex-direction:column;align-items:center;}
  canvas{display:block;border-radius:14px;background:#5aa86a;box-shadow:0 16px 50px rgba(0,0,0,.55);}
  #pad{width:100%;display:flex;justify-content:space-between;align-items:center;padding:10px 16px 2px;}
  .dpad{position:relative;width:126px;height:126px;}
  .dbtn{position:absolute;width:42px;height:42px;background:rgba(255,255,255,.1);
    border:1px solid rgba(255,255,255,.22);border-radius:10px;display:flex;align-items:center;
    justify-content:center;color:#fff;font-size:17px;}
  .dbtn:active{background:rgba(255,255,255,.3);}
  #up{left:42px;top:0;} #down{left:42px;bottom:0;} #left{left:0;top:42px;} #right{right:0;top:42px;}
  .abtns{display:flex;gap:12px;align-items:center;}
  .rbtn{width:56px;height:56px;border-radius:50%;border:none;font-family:"Jua",sans-serif;
    font-size:18px;color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.3);}
  #a{background:linear-gradient(180deg,#ff9ecf,#ff5c9a);}
  #b{background:linear-gradient(180deg,#9ab6ff,#5c7aff);width:46px;height:46px;font-size:14px;}
  .rbtn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.3);}
  #sound{position:absolute;top:8px;right:8px;font-size:16px;background:rgba(0,0,0,.3);border:none;
    border-radius:8px;padding:3px 7px;color:#fff;z-index:6;}
  #hint{position:absolute;top:8px;left:10px;font-size:11px;color:rgba(255,255,255,.85);
    background:rgba(0,0,0,.3);padding:3px 8px;border-radius:8px;font-family:"Jua",sans-serif;}
  /* 도감 */
  #dex{position:absolute;inset:0;border-radius:14px;background:linear-gradient(160deg,#2a1a48,#160e2e);
    display:none;flex-direction:column;padding:14px;overflow:hidden;}
  #dex.show{display:flex;}
  #dexHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
  #dexHead h2{font-family:"Jua",sans-serif;font-size:18px;margin:0;}
  #dexHead .cnt{font-size:12px;color:#ffd36b;}
  #dexClose{background:#ff5c9a;border:none;color:#fff;font-family:"Jua";border-radius:8px;padding:5px 12px;font-size:14px;}
  #dexGrid{flex:1;overflow-y:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding-right:4px;}
  .pcard{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:14px;
    padding:8px 4px 9px;text-align:center;position:relative;}
  .pcard.locked{opacity:.55;}
  .pcard canvas{width:60px;height:60px;background:transparent;box-shadow:none;border-radius:0;}
  .pcard .pn{font-size:11px;margin-top:2px;font-family:"Jua",sans-serif;}
  .pcard .pk{font-size:9px;color:#c9b8e8;}
  .pcard .badge{position:absolute;top:5px;right:6px;font-size:11px;}
  .pcard.next{border-color:#ffd36b;box-shadow:0 0 0 2px rgba(255,211,107,.4);}
  .pcard.next .badge{color:#ffd36b;}
  #dexTip{font-size:11px;color:#c9b8e8;text-align:center;margin-top:8px;}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv"></canvas>
  <div id="hint">티니핑 어드벤처</div>
  <button id="sound" aria-label="소리">🔊</button>
  <div id="pad">
    <div class="dpad">
      <div class="dbtn" id="up">▲</div><div class="dbtn" id="down">▼</div>
      <div class="dbtn" id="left">◀</div><div class="dbtn" id="right">▶</div>
    </div>
    <div class="abtns"><button class="rbtn" id="b">도감</button><button class="rbtn" id="a">A</button></div>
  </div>
  <div id="dex">
    <div id="dexHead"><h2>💛 티니핑 도감</h2><span class="cnt" id="dexCnt"></span>
      <button id="dexClose">닫기</button></div>
    <div id="dexGrid"></div>
    <div id="dexTip">잡을 티니핑(⭐)을 눌러 에피소드를 시작해요!</div>
  </div>
</div>

<script>
(() => {
  "use strict";
  const TILE=32, VW=12, VH=13, BASE_W=VW*TILE, BASE_H=VH*TILE+4;
  const cv=document.getElementById("cv"), ctx=cv.getContext("2d");
  const hintEl=document.getElementById("hint");
  function resize(){ const dpr=Math.min(window.devicePixelRatio||1,2);
    cv.width=BASE_W*dpr; cv.height=BASE_H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); ctx.imageSmoothingEnabled=false;
    const scale=Math.min(window.innerWidth/BASE_W,(window.innerHeight-158)/BASE_H);
    cv.style.width=BASE_W*scale+"px"; cv.style.height=BASE_H*scale+"px";
    document.getElementById("wrap").style.width=BASE_W*scale+"px";
    document.getElementById("dex").style.height=BASE_H*scale+"px"; }
  addEventListener("resize",resize); resize();

  // ── 사운드 ──
  const S={on:true,ctx:null};
  function initAudio(){ if(!S.ctx){ try{ S.ctx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } }
  function blip(f,d=0.08,t="square",v=0.12,to=null){ if(!S.on||!S.ctx)return;
    const n=S.ctx.currentTime,o=S.ctx.createOscillator(),g=S.ctx.createGain();
    o.type=t;o.frequency.setValueAtTime(f,n); if(to)o.frequency.exponentialRampToValueAtTime(to,n+d);
    g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(0.0001,n+d);
    o.connect(g);g.connect(S.ctx.destination);o.start(n);o.stop(n+d); }
  const sfx={ step(){blip(220,0.05,"square",0.05);}, talk(){blip(520,0.05,"triangle",0.09,640);},
    sel(){blip(700,0.05,"square",0.08);}, hit(){blip(160,0.14,"sawtooth",0.14,80);},
    magic(){blip(700,0.2,"sine",0.12,1500);}, heal(){blip(600,0.15,"triangle",0.11,1000);},
    catch2(){[600,800,1100].forEach((f,i)=>setTimeout(()=>blip(f,0.14,"triangle",0.13),i*90));},
    win(){[523,659,784,1047].forEach((f,i)=>setTimeout(()=>blip(f,0.18,"triangle",0.12),i*120));},
    lose(){[400,300,200].forEach((f,i)=>setTimeout(()=>blip(f,0.25,"sawtooth",0.12),i*140));},
    enc(){blip(120,0.3,"square",0.16,60);} };
  document.getElementById("sound").addEventListener("click",()=>{S.on=!S.on;
    document.getElementById("sound").textContent=S.on?"🔊":"🔇";initAudio();});

  // ── 티니핑 등록부 (데이터로 에피소드 자동 생성) ──
  // body:[밝은색,진한색]  kw: 감정/특징(원작 참고, 대사는 오리지널)  line: 에피소드 인트로
  // acc: fallback 장식(heart/crown/star/none)  hp: 전투 체력
  const PINGS=[
    {id:"hachu",name:"프린세스 하츄핑",kw:"사랑",acc:"heart",body:["#ff9ec9","#ff5c9a"],hp:0,partner:true,
      line:["로미의 곁을 지키는 사랑의 파트너, 하츄핑!","함께 모험을 떠나자!"]},
    {id:"sapun",name:"사뿐핑",kw:"우아함",acc:"crown",body:["#e7f2ff","#a9c7ff"],hp:20,
      line:["사뿐사뿐~ 우아하게 춤추는 티니핑!","너무 우아해서 잡기 힘들어. 살살 달래보자!"]},
    {id:"areum",name:"아름핑",kw:"아름다움",acc:"heart",body:["#ffd9ec","#ff9ecf"],hp:22,
      line:["세상 모든 게 아름다워 보이는 아름핑!","반짝임에 홀리지 말고 캐치!"]},
    {id:"ppony",name:"뽀니핑",kw:"멋",acc:"star",body:["#fff2b0","#ffcf6b"],hp:22,
      line:["멋내기라면 자신 있어, 뽀니핑 등장!","멋진 갈기를 휘날리며 도망친다!"]},
    {id:"ppoduk",name:"뽀득핑",kw:"깨끗함",acc:"none",body:["#bfe6ff","#5aa0e0"],hp:24,
      line:["여긴 왜 이렇게 지저분해! 뽀득핑이야.","반짝반짝 닦아주고 싶어 안달났어. 진정시켜 캐치!"]},
    {id:"charming",name:"차밍핑",kw:"매력",acc:"heart",body:["#ffe89a","#ffbf4d"],hp:22,
      line:["치명적인 매력의 소유자, 차밍핑!","윙크 한 방에 넘어가지 말고 캐치!"]},
    {id:"nabi",name:"나비핑",kw:"설렘",acc:"none",body:["#cdeaff","#7fc0f0"],hp:22,
      line:["팔랑팔랑 설렘을 퍼뜨리는 나비핑!","이리저리 날아다녀 잡기 어려워!"]},
    {id:"silk",name:"실크핑",kw:"부드러움",acc:"heart",body:["#ffd0e0","#ff8fb0"],hp:23,
      line:["세상에서 제일 부드러운 실크핑!","보들보들 미끄러워 놓치기 쉬워. 집중!"]},
    {id:"snow",name:"스노우핑",kw:"시원함",acc:"none",body:["#dff4ff","#8fd0ff"],hp:24,
      line:["차갑고 시원한 겨울요정 스노우핑!","눈보라를 일으키기 전에 진정시키자!"]},
    {id:"iseul",name:"이슬핑",kw:"촉촉함",acc:"none",body:["#bff0d0","#5fc98a"],hp:22,
      line:["촉촉한 눈물의 요정, 이슬핑!","울음이 터지기 전에 살살 달래줘!"]},
    {id:"coolcool",name:"쿨쿨핑",kw:"잠",acc:"none",body:["#e6d6ff","#b79aff"],hp:24,
      line:["드르렁~ 잠꾸러기 쿨쿨핑!","잠투정 부리기 전에 살금살금 캐치!"]},
    {id:"shushu",name:"슈슈핑",kw:"수줍음",acc:"heart",body:["#cfe0ff","#8fb0ff"],hp:22,
      line:["부끄부끄 수줍은 슈슈핑!","놀라게 하면 도망가니 조심조심!"]},
    {id:"longlong",name:"롱롱핑",kw:"느긋함",acc:"crown",body:["#f0d9ff","#c79bff"],hp:23,
      line:["느긋~하게 긴 하루를 즐기는 롱롱핑!","느릿느릿하지만 방심은 금물!"]},
    {id:"cue",name:"큐핑",kw:"귀여움",acc:"crown",body:["#ffd9ee","#ff9ed0"],hp:20,
      line:["귀여움이 폭발하는 막내 큐핑!","윙크 공격에 무장해제 되지 말고 캐치!"]},
    {id:"yaong",name:"야옹핑",kw:"장난",acc:"none",body:["#fff0a8","#ffd24d"],hp:24,
      line:["야옹~ 장난꾸러기 고양이요정 야옹핑!","요리조리 도망치는 걸 좋아해!"]},
    {id:"charle",name:"샤를핑",kw:"품위",acc:"crown",body:["#eaf2ff","#b9d0ff"],hp:28,legend:true,
      line:["기품 넘치는 레전드핑, 샤를핑!","품격 있는 상대야. 정신 바짝 차려!"]},
    {id:"trot",name:"트롯핑",kw:"흥",acc:"star",body:["#bcd0ff","#6f8fff"],hp:28,legend:true,
      line:["흥이 넘치는 무대의 제왕, 트롯핑!","신나는 리듬에 휩쓸리지 말고 캐치!"]},
    {id:"kkaegul",name:"깨굴핑",kw:"명랑",acc:"crown",body:["#c7f0c0","#6fc86f"],hp:28,legend:true,
      line:["개굴개굴~ 명랑한 레전드핑 깨굴핑!","폴짝폴짝 뛰어다녀 잡기 힘들어!"]},
    {id:"gentle",name:"젠틀핑",kw:"신사다움",acc:"crown",body:["#bfe6c8","#5fae7a"],hp:30,legend:true,
      line:["완벽한 신사, 레전드핑 젠틀핑!","마지막 레전드핑! 최선을 다하자!"]},
  ];
  // 캐릭터별 시각 특징 (오리지널 표현)
  const FEATS={ ppoduk:"sparkle", charming:"wink", nabi:"butterfly", snow:"snow", iseul:"flower",
    coolcool:"sleep", longlong:"long", cue:"wink", yaong:"cat", trot:"shades", kkaegul:"frog", gentle:"monocle" };
  PINGS.forEach(p=>{ p.feat=FEATS[p.id]||"none"; });

  // 최종장 (자매 & 거울)
  const DIANA={id:"diana",name:"다이아나핑",kw:"빛의 언니"};
  const ECLIPSE={id:"eclipse",name:"이클립스핑",kw:"어둠의 동생",hp:40};
  const MIRROR={id:"mirror",name:"미루아르(거울)",kw:"진짜 흑막",hp:60};

  // ── 세이브 ──
  const SAVE_KEY="teenieping_save_v2";
  let caught={}; // id: true
  function load(){ try{ caught=JSON.parse(localStorage.getItem(SAVE_KEY)||"{}")||{}; }catch(e){ caught={}; }
    caught.hachu=true; } // 하츄핑은 처음부터 파트너
  function save(){ try{ localStorage.setItem(SAVE_KEY,JSON.stringify(caught)); }catch(e){} }
  load();
  const catchTargets=()=>PINGS.filter(p=>!p.partner);
  const caughtCount=()=>catchTargets().filter(p=>caught[p.id]).length;
  const allCaught=()=>catchTargets().every(p=>caught[p.id]);
  function nextTarget(){ return catchTargets().find(p=>!caught[p.id]); }

  // ── 스프라이트 교체 ──
  const IDS=[...PINGS.map(p=>p.id),"diana","eclipse","mirror","darkbit","royal"];
  const IMG={};
  IDS.forEach(k=>{ const im=new Image(); im._ok=false; im.onload=()=>im._ok=true; im.onerror=()=>im._ok=false;
    im.src="assets/"+k+".png"; IMG[k]=im; });

  // ── fallback 아트 ──
  function eyeF(x,y,rx,ry,mid,lo){ ctx.fillStyle="#fff";ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,7);ctx.fill();
    ctx.fillStyle=mid;ctx.beginPath();ctx.ellipse(x,y+ry*0.12,rx*0.8,ry*0.85,0,0,7);ctx.fill();
    ctx.fillStyle="#3a2340";ctx.beginPath();ctx.ellipse(x,y+ry*0.2,rx*0.4,ry*0.5,0,0,7);ctx.fill();
    ctx.fillStyle="#fff";ctx.beginPath();ctx.ellipse(x-rx*0.35,y-ry*0.3,rx*0.3,ry*0.34,0,0,7);ctx.fill(); }
  function heartF(x,y,s,c){ ctx.save();ctx.translate(x,y);ctx.scale(s/16,s/16);
    ctx.beginPath();ctx.moveTo(0,4);ctx.bezierCurveTo(-9,-6,-17,5,0,16);ctx.bezierCurveTo(17,5,9,-6,0,4);
    ctx.closePath();ctx.fillStyle=c;ctx.fill();ctx.restore(); }
  function crownF(x,y,w,c){ ctx.fillStyle=c;ctx.beginPath();ctx.moveTo(x-w,y);ctx.lineTo(x-w*0.5,y-w*0.9);
    ctx.lineTo(x,y-w*0.25);ctx.lineTo(x+w*0.5,y-w*0.9);ctx.lineTo(x+w,y);ctx.closePath();ctx.fill(); }
  function starF(x,y,r,c){ ctx.fillStyle=c;ctx.beginPath();
    for(let i=0;i<5;i++){const a=-Math.PI/2+i*2*Math.PI/5;ctx.lineTo(x+Math.cos(a)*r,y+Math.sin(a)*r);
      const a2=a+Math.PI/5;ctx.lineTo(x+Math.cos(a2)*r*0.45,y+Math.sin(a2)*r*0.45);}ctx.closePath();ctx.fill(); }
  function blushF(x,y,r){ ctx.fillStyle="rgba(255,140,180,.5)";ctx.beginPath();ctx.ellipse(x,y,r,r*0.66,0,0,7);ctx.fill(); }

  function fRomi(s){ const k=s/150; ctx.scale(k,k);
    ctx.fillStyle="#ff9dcf";ctx.beginPath();ctx.ellipse(-46,10,16,30,0.35,0,7);ctx.fill();
    ctx.beginPath();ctx.ellipse(46,10,16,30,-0.35,0,7);ctx.fill();
    ctx.fillStyle="#ff6fae";ctx.beginPath();ctx.moveTo(-30,60);ctx.quadraticCurveTo(0,34,30,60);ctx.lineTo(30,74);ctx.lineTo(-30,74);ctx.closePath();ctx.fill();
    const fg=ctx.createRadialGradient(0,-4,6,0,0,44);fg.addColorStop(0,"#fff6fb");fg.addColorStop(1,"#ffe6f1");
    ctx.fillStyle=fg;ctx.beginPath();ctx.arc(0,-2,40,0,7);ctx.fill();
    ctx.fillStyle="#ff9dcf";ctx.beginPath();ctx.moveTo(-40,-4);ctx.quadraticCurveTo(-42,-40,0,-42);
    ctx.quadraticCurveTo(42,-40,40,-4);ctx.quadraticCurveTo(22,-20,10,-6);ctx.quadraticCurveTo(0,-22,-10,-6);
    ctx.quadraticCurveTo(-22,-20,-40,-4);ctx.closePath();ctx.fill();
    crownF(0,-34,13,"#ffd36b");
    eyeF(-16,6,10,13,"#ff7ab8","#c94f8e"); eyeF(16,6,10,13,"#ff7ab8","#c94f8e");
    blushF(-26,18,7); blushF(26,18,7);
    ctx.strokeStyle="#c94f7a";ctx.lineWidth=2.4;ctx.lineCap="round";ctx.beginPath();ctx.arc(0,22,6,0.15*Math.PI,0.85*Math.PI);ctx.stroke(); }

  // 통합 티니핑 아트 (어떤 컨텍스트 g에도 그림 · 캐릭터별 feat 반영)
  function pingArt(g, ping, s){
    const k=s/150; g.save(); g.scale(k,k);
    const hi=ping.body[0], lo=ping.body[1], feat=ping.feat||"none";
    const arc=(x,y,r)=>{g.beginPath();g.arc(x,y,r,0,7);g.fill();};
    const ell=(x,y,rx,ry,rot)=>{g.beginPath();g.ellipse(x,y,rx,ry,rot||0,0,7);g.fill();};
    // 글로우
    let gl=g.createRadialGradient(0,0,10,0,0,50);gl.addColorStop(0,lo+"88");gl.addColorStop(1,lo+"00");
    g.fillStyle=gl;arc(0,0,50);
    // 머리카락
    g.fillStyle=lo;
    if(feat==="long"){ ell(37,26,13,42,-0.25); ell(-37,26,13,42,0.25); } else { ell(34,20,12,26,-0.3); }
    // 몸통
    let bg=g.createRadialGradient(-10,-14,6,0,0,42);bg.addColorStop(0,hi);bg.addColorStop(1,lo);
    g.fillStyle=bg;arc(0,4,38);
    // 귀 / 머리 장식
    if(feat==="cat"){ g.fillStyle=lo;
      g.beginPath();g.moveTo(-31,-28);g.lineTo(-15,-42);g.lineTo(-11,-20);g.closePath();g.fill();
      g.beginPath();g.moveTo(31,-28);g.lineTo(15,-42);g.lineTo(11,-20);g.closePath();g.fill();
      g.fillStyle="#ffb3d0";
      g.beginPath();g.moveTo(-25,-28);g.lineTo(-17,-36);g.lineTo(-15,-24);g.closePath();g.fill();
      g.beginPath();g.moveTo(25,-28);g.lineTo(17,-36);g.lineTo(15,-24);g.closePath();g.fill(); }
    else { g.fillStyle=lo; ell(-30,-22,10,16,0.5); ell(30,-22,10,16,-0.5); }
    g.fillStyle=hi;arc(0,4,38);
    // 눈
    const eye=(x,y,rx,ry,closed)=>{ if(closed){ g.strokeStyle="#4a2c4e";g.lineWidth=2.6;g.lineCap="round";
        g.beginPath();g.arc(x,y+2,rx,1.12*Math.PI,1.88*Math.PI);g.stroke(); return; }
      g.fillStyle="#fff";ell(x,y,rx,ry); g.fillStyle=lo;ell(x,y+ry*0.12,rx*0.8,ry*0.85);

  // key로 캐릭터 그리기 (실제 이미지 우선, 없으면 fallback)
  function pingById(id){ return PINGS.find(p=>p.id===id) || (id==="royal"?{body:["#a9d4ff","#5c9aff"],acc:"crown"}:null); }
  function drawChar(key,x,y,size){

    ctx.save(); ctx.translate(x,y-size/2);
    if(key==="romi") fRomi(size);
    else if(key==="diana") fSister(size,true);
    else if(key==="eclipse") fSister(size,false);
    else if(key==="mirror") fMirror(size);
    else if(key==="darkbit") fDark(size);
    else { const p=pingById(key); if(p) pingArt(ctx,p,size); else fDark(size); }
    ctx.restore();
  }

  // ── 맵 (하모니 마을 허브) ──

      else if(c==="N"){entities[x+","+y]={type:"npc"};c="=";}

  // 오프닝

    {bg:"train",name:"나레이션",text:"그런데 갑자기, 정체 모를 어둠의 힘이 열차를 덮쳤다 —"},
    {bg:"dark",name:"이클립스핑",text:"후훗… 프린세스 티니핑들아, 뿔뿔이 흩어져라!"},
    {bg:"dark",name:"나레이션",text:"프린세스 티니핑들이 하모니 마을 곳곳으로 흩어져 버렸다!"},
    {bg:"village",name:"하츄핑",text:"로미야! 흩어진 프린세스 티니핑들을 모두 캐치해서 회담을 되살리자!"},

  function bSay(lines,then){ battle.queue=lines.slice();battle.shown=0;battle.then=then||null;battle.awaiting=false; }
  function startBattle(ping,kind){
    battle.ping=ping; battle.kind=kind||"catch"; battle.ehp=ping.hp; battle.ehpMax=ping.hp;
    battle.php=battle.phpMax; battle.pmp=battle.pmpMax; battle.sel=0; mode="battle"; sfx.enc();

  const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));

    if(mode==="title"){ mode="opening"; openIdx=0; openShown=0; return; }
    if(mode==="opening"){ if(openShown<OPENING[openIdx].text.length){openShown=OPENING[openIdx].text.length;return;}
      openIdx++; if(openIdx>=OPENING.length){ mode="field"; } else { openShown=0; sfx.talk(); } return; }
    if(mode==="dialog"){ dlgAdvance(); return; }
    if(mode==="field"){ interact(); return; }
    if(mode==="ending"){ return; }
    if(mode==="battle"){
      if(battle.shown<(battle.queue[0]||"").length){battle.shown=battle.queue[0].length;return;}
      if(battle.queue.length){ battle.queue.shift();battle.shown=0;
        if(!battle.queue.length){const t=battle.then;battle.then=null;if(t)t();} return; }
      if(battle.awaiting){ sfx.sel(); chooseCommand(battle.sel); } } }
  function pressB(){ if(mode==="field"){ openDex(); } else if(mode==="dialog"){ dlgAdvance(); } }
  function moveSel(dx,dy){ if(mode==="battle"&&battle.awaiting){ const col=battle.sel%2,row=(battle.sel/2)|0;
    battle.sel=Math.max(0,Math.min(1,row+dy))*2+Math.max(0,Math.min(1,col+dx)); sfx.sel(); } }
  function bind(id,fn){ document.getElementById(id).addEventListener("pointerdown",e=>{e.preventDefault();fn();}); }
  bind("up",()=>{tryMove("up");moveSel(0,-1);}); bind("down",()=>{tryMove("down");moveSel(0,1);});
  bind("left",()=>{tryMove("left");moveSel(-1,0);}); bind("right",()=>{tryMove("right");moveSel(1,0);});
  bind("a",pressA); bind("b",pressB);
  addEventListener("keydown",e=>{ if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"," "].includes(e.key))e.preventDefault();
    if(e.key==="ArrowUp"){tryMove("up");moveSel(0,-1);} else if(e.key==="ArrowDown"){tryMove("down");moveSel(0,1);}
    else if(e.key==="ArrowLeft"){tryMove("left");moveSel(-1,0);} else if(e.key==="ArrowRight"){tryMove("right");moveSel(1,0);}
    else if(e.key==="z"||e.key==="Z"||e.key==="Enter"||e.key===" ")pressA(); else if(e.key==="x"||e.key==="X")pressB(); });
  cv.addEventListener("pointerdown",e=>{ if(mode!=="battle"||!battle.awaiting)return;
    const r=cv.getBoundingClientRect(),mx=(e.clientX-r.left)/r.width*BASE_W,my=(e.clientY-r.top)/r.height*BASE_H;
    if(my<BASE_H-86)return; const col=mx<BASE_W/2?0:1,row=my<BASE_H-44?0:1; battle.sel=row*2+col;sfx.sel();chooseCommand(battle.sel); });

  // ── 도감 ──
  const dexEl=document.getElementById("dex"), dexGrid=document.getElementById("dexGrid"), dexCnt=document.getElementById("dexCnt");
  function openDex(){ initAudio(); mode="dex"; dexEl.classList.add("show"); renderDex(); }
  function closeDex(){ dexEl.classList.remove("show"); mode="field"; }
  document.getElementById("dexClose").addEventListener("click",()=>{ sfx.sel(); closeDex(); });
  function renderDex(){
    dexCnt.textContent=caughtCount()+" / "+catchTargets().length+" 마리";
    dexGrid.innerHTML="";
    const next=nextTarget();
    for(const p of PINGS){
      const got=!!caught[p.id]; const isNext=next&&p.id===next.id;
      const card=document.createElement("div");
      card.className="pcard"+(got?"":" locked")+(isNext?" next":"");
      const c=document.createElement("canvas"); c.width=120; c.height=120;
      const cx=c.getContext("2d"); cx.scale(2,2);
      cx.save(); cx.translate(30,30);
      if(got||isNext){ const im=IMG[p.id];
        if(im&&im._ok) cx.drawImage(im,-24,-26,48,48); else pingArt(cx,p,50); }
      else { cx.fillStyle="rgba(255,255,255,.15)"; cx.beginPath(); cx.arc(0,-2,20,0,7); cx.fill();
        cx.fillStyle="rgba(255,255,255,.45)"; cx.font="18px Jua"; cx.textAlign="center"; cx.textBaseline="middle"; cx.fillText("?",0,-1); }
      cx.restore();
      card.appendChild(c);
      card.insertAdjacentHTML("beforeend",
        `<div class="pn">${got||isNext?p.name:"???"}</div><div class="pk">${got?p.kw:(isNext?"⭐ 지금 도전!":"")}</div>
         <div class="badge">${got?"✅":(isNext?"⭐":"🔒")}</div>`);
      if((isNext||(!got&&p.partner))){ card.style.cursor="pointer";
        card.addEventListener("click",()=>{ if(p.partner)return; sfx.sel(); startEpisode(p); }); }
      dexGrid.appendChild(card);
    }
  }
  function startEpisode(p){ closeDex(); say("에피소드",p.line,()=>{ startBattle(p,"catch"); }); }

  // ── 업데이트 ──
  function update(dt){ tAll+=dt;
    if(mode==="field"&&player.moving){ player.t+=dt*6.5;
      if(player.t>=1){player.t=1;player.moving=false;player.x+=player.fx;player.y+=player.fy;player.px=player.x*TILE;player.py=player.y*TILE;}
      else{player.px=(player.x+player.fx*player.t)*TILE;player.py=(player.y+player.fy*player.t)*TILE;} }
    cam.x=Math.max(0,Math.min(MW*TILE-BASE_W,player.px+TILE/2-BASE_W/2));
    cam.y=Math.max(0,Math.min(MH*TILE-BASE_H,player.py+TILE/2-BASE_H/2));
    if(battle.flash>0)battle.flash-=dt*2; if(battle.shake>0)battle.shake-=dt*3;
    if(mode==="dialog"&&dlg.active)dlg.shown=Math.min(dlg.lines[dlg.i].length,dlg.shown+dt*38);
    if(mode==="opening")openShown=Math.min(OPENING[openIdx].text.length,openShown+dt*34);
    if(mode==="battle"&&battle.queue.length)battle.shown=Math.min(battle.queue[0].length,battle.shown+dt*40); }

  // ── 렌더 ──
  function drawField(){ ctx.save(); ctx.translate(-Math.round(cam.x),-Math.round(cam.y));
    const x0=Math.floor(cam.x/TILE),y0=Math.floor(cam.y/TILE);
    for(let y=y0;y<=y0+VH+1&&y<MH;y++)for(let x=x0;x<=x0+VW+1&&x<MW;x++){ if(x<0||y<0)continue;
      const c=grid[y][x],px=x*TILE,py=y*TILE;
      ctx.fillStyle=c==="="?"#e3c78a":"#66b06e"; ctx.fillRect(px,py,TILE,TILE);
      if(c==="."||c==="g"){ctx.fillStyle="#5ea567";ctx.fillRect(px+4,py+20,3,3);ctx.fillRect(px+22,py+8,3,3);}
      if(c==="="){ctx.fillStyle="#d8b979";ctx.fillRect(px,py,TILE,2);}
      if(c==="g"){ctx.fillStyle="#357a45";for(let i=0;i<3;i++)ctx.fillRect(px+4+i*9,py+18,4,10);}
      if(c==="#"){ctx.fillStyle="#66b06e";ctx.fillRect(px,py,TILE,TILE);ctx.fillStyle="#7a4a2a";ctx.fillRect(px+13,py+18,6,12);
        ctx.fillStyle="#2f8a45";ctx.beginPath();ctx.arc(px+16,py+13,12,0,7);ctx.fill();ctx.fillStyle="#3fa055";ctx.beginPath();ctx.arc(px+12,py+10,6,0,7);ctx.fill();}
      if(c==="H"){ctx.fillStyle="#66b06e";ctx.fillRect(px,py,TILE,TILE);ctx.fillStyle="#f2e4c8";ctx.fillRect(px+3,py+13,26,17);
        ctx.fillStyle="#e0668a";ctx.beginPath();ctx.moveTo(px+1,py+14);ctx.lineTo(px+16,py+2);ctx.lineTo(px+31,py+14);ctx.closePath();ctx.fill();
        ctx.fillStyle="#a86a3a";ctx.fillRect(px+13,py+21,7,9);ctx.fillStyle="#8fd0ff";ctx.fillRect(px+5,py+16,5,5);ctx.fillRect(px+22,py+16,5,5);} }
    const bob=Math.sin(tAll*4)*1.5;
    for(const key in entities){ const [ex,ey]=key.split(",").map(Number),e=entities[key],cx=ex*TILE+TILE/2,cy=ey*TILE+TILE;
      if(e.type==="npc") owChar("hachu",cx,cy,bob);
      else if(e.type==="sign"){ ctx.fillStyle="#a86a3a";ctx.fillRect(cx-2,cy-14,4,12);
        ctx.fillStyle="#f2e4c8";ctx.fillRect(cx-9,cy-26,18,13);ctx.fillStyle="#8a5a2a";ctx.fillRect(cx-7,cy-23,14,2);ctx.fillRect(cx-7,cy-19,14,2); }
      else if(e.type==="gate"){ const open=allCaught();
        ctx.fillStyle=open?"#c79bff":"#5a4a6a"; ctx.fillRect(cx-14,cy-30,28,30);
        ctx.fillStyle=open?"#a06fe0":"#3a2f4a"; ctx.fillRect(cx-10,cy-24,20,24);
        ctx.fillStyle="#ffd36b"; crownF(cx,cy-30,7,"#ffd36b");
        if(open){ctx.fillStyle="#fff";ctx.font="9px Jua";ctx.textAlign="center";ctx.fillText("거울의 성",cx,cy-8);} } }
    const pbob=player.moving?Math.abs(Math.sin(player.t*Math.PI*2))*2:Math.sin(tAll*3);
    owChar("romi",player.px+TILE/2,player.py+TILE,pbob);
    ctx.restore(); }

  function rr(x,y,w,h,r){ ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath(); }
  function wrapText(t,x,y,maxW,lh){ let line="",yy=y; for(const ch of [...t]){ const test=line+ch;
    if(ctx.measureText(test).width>maxW){ctx.fillText(line,x,yy);line=ch;yy+=lh;}else line=test;} ctx.fillText(line,x,yy); }
  function drawDialogBox(name,text){ const bx=8,by=BASE_H-92,bw=BASE_W-16,bh=84;
    ctx.fillStyle="rgba(20,10,32,.92)";rr(bx,by,bw,bh,12);ctx.fill();
    ctx.strokeStyle="#ff9ecf";ctx.lineWidth=3;rr(bx,by,bw,bh,12);ctx.stroke();
    if(name){ ctx.fillStyle="#ff5c9a";rr(bx+12,by-13,name.length*15+20,24,8);ctx.fill();
      ctx.fillStyle="#fff";ctx.font='15px Jua, sans-serif';ctx.textAlign="left";ctx.textBaseline="middle";ctx.fillText(name,bx+22,by-1); }
    ctx.fillStyle="#fff";ctx.font='15px "Noto Sans KR", sans-serif';ctx.textAlign="left";ctx.textBaseline="top";
    wrapText(text,bx+16,by+16,bw-32,22);
    if(Math.sin(tAll*6)>0){ctx.fillStyle="#ff9ecf";ctx.textAlign="right";ctx.fillText("▼",bx+bw-16,by+bh-24);} }

  function bar(x,y,w,frac,col){ ctx.fillStyle="rgba(0,0,0,.35)";rr(x,y,w,8,4);ctx.fill();
    ctx.fillStyle=col;rr(x,y,w*Math.max(0,frac),8,4);ctx.fill(); }
  function drawBattle(){ const g=ctx.createLinearGradient(0,0,0,BASE_H);
    if(battle.kind==="boss"){g.addColorStop(0,"#2a1240");g.addColorStop(1,"#160a2e");}
    else{g.addColorStop(0,"#3a2360");g.addColorStop(1,"#1a1030");}
    ctx.fillStyle=g;ctx.fillRect(0,0,BASE_W,BASE_H);
    ctx.save(); if(battle.shake>0)ctx.translate((Math.random()-0.5)*6,(Math.random()-0.5)*6);
    ctx.save(); if(battle.flash>0)ctx.globalAlpha=Math.sin(tAll*30)>0?0.4:1;
    drawChar(battle.ping.id, BASE_W-92, 132, 96); ctx.restore();
    ctx.fillStyle="rgba(20,10,32,.8)";rr(12,20,190,42,8);ctx.fill();
    ctx.fillStyle="#fff";ctx.font='14px Jua, sans-serif';ctx.textAlign="left";ctx.textBaseline="middle";
    ctx.fillText(battle.ping.name,22,33); bar(22,45,168,battle.ehp/battle.ehpMax,battle.kind==="boss"?"#b06bff":"#ff6f91");
    // 아군
    drawChar("hachu",68,252,48); drawChar("romi",116,268,104);
    ctx.fillStyle="rgba(20,10,32,.8)";rr(BASE_W-196,196,184,52,8);ctx.fill();
    ctx.fillStyle="#fff";ctx.font='14px Jua, sans-serif';ctx.textAlign="left";ctx.fillText("로미 ♥ 하츄핑",BASE_W-186,210);
    ctx.font='11px "Noto Sans KR"';ctx.fillStyle="#a8f0ff";ctx.fillText("HP",BASE_W-186,226);bar(BASE_W-166,222,120,battle.php/battle.phpMax,"#5ce08a");
    ctx.fillStyle="#c79bff";ctx.fillText("MP",BASE_W-186,240);bar(BASE_W-166,236,120,battle.pmp/battle.pmpMax,"#9a7aff");
    ctx.restore();
    const by=BASE_H-92,bh=84;
    ctx.fillStyle="rgba(20,10,32,.94)";rr(8,by,BASE_W-16,bh,12);ctx.fill();
    ctx.strokeStyle="#9ab6ff";ctx.lineWidth=3;rr(8,by,BASE_W-16,bh,12);ctx.stroke();
    if(battle.awaiting){ ctx.font='15px Jua, sans-serif';ctx.textBaseline="middle";
      for(let i=0;i<4;i++){ const col=i%2,row=(i/2)|0,cx=20+col*(BASE_W/2-14),cy=by+16+row*34,sel=battle.sel===i;
        ctx.fillStyle=sel?"#ff5c9a":"rgba(255,255,255,.08)";rr(cx,cy,BASE_W/2-30,28,7);ctx.fill();
        ctx.fillStyle=sel?"#fff":"#e8d8f0";ctx.textAlign="left";ctx.fillText((sel?"▶ ":"  ")+COMMANDS[i].label,cx+8,cy+15); } }
    else { ctx.fillStyle="#fff";ctx.font='15px "Noto Sans KR"';ctx.textAlign="left";ctx.textBaseline="top";
      wrapText((battle.queue[0]||"").slice(0,Math.floor(battle.shown)),22,by+18,BASE_W-44,22);
      if(battle.shown>=(battle.queue[0]||"").length&&Math.sin(tAll*6)>0){ctx.fillStyle="#9ab6ff";ctx.textAlign="right";ctx.fillText("▼",BASE_W-24,by+bh-24);} } }

  function drawOpeningBG(bg){ let g=ctx.createLinearGradient(0,0,0,BASE_H);
    if(bg==="train"){g.addColorStop(0,"#4a6a9a");g.addColorStop(1,"#20304a");ctx.fillStyle=g;ctx.fillRect(0,0,BASE_W,BASE_H);
      ctx.fillStyle="#2a3a5a";ctx.fillRect(0,BASE_H*0.55,BASE_W,BASE_H*0.45);
      ctx.fillStyle="#e0d0a0";for(let i=0;i<8;i++)ctx.fillRect(30+i*45,BASE_H*0.5,26,18);
      ctx.fillStyle="#8fd0ff";for(let i=0;i<8;i++)ctx.fillRect(34+i*45,BASE_H*0.53,18,10); }
    else if(bg==="dark"){g.addColorStop(0,"#2a1240");g.addColorStop(1,"#0e0620");ctx.fillStyle=g;ctx.fillRect(0,0,BASE_W,BASE_H);
      for(let i=0;i<20;i++){ctx.globalAlpha=0.3;ctx.fillStyle="#b06bff";ctx.fillRect((i*57)%BASE_W,(i*83+tAll*20)%BASE_H,3,3);}ctx.globalAlpha=1; }
    else {g.addColorStop(0,"#7ac0e0");g.addColorStop(1,"#a8e0a0");ctx.fillStyle=g;ctx.fillRect(0,0,BASE_W,BASE_H);
      ctx.fillStyle="#66b06e";ctx.fillRect(0,BASE_H*0.65,BASE_W,BASE_H*0.35);} }
  function drawOpening(){ const o=OPENING[openIdx]; drawOpeningBG(o.bg);
    if(o.name==="이클립스핑") drawChar("eclipse",BASE_W/2,BASE_H*0.6,110);
    else if(o.name==="하츄핑") drawChar("hachu",BASE_W/2,BASE_H*0.6,90);
    else { drawChar("romi",BASE_W/2-30,BASE_H*0.6,96); drawChar("hachu",BASE_W/2+48,BASE_H*0.55,56); }
    drawDialogBox(o.name,o.text.slice(0,Math.floor(openShown))); }

  function drawTitle(){ const g=ctx.createLinearGradient(0,0,0,BASE_H);g.addColorStop(0,"#3a2360");g.addColorStop(1,"#170e2e");
    ctx.fillStyle=g;ctx.fillRect(0,0,BASE_W,BASE_H);
    for(let i=0;i<24;i++){const x=(i*71.3)%BASE_W,y=(i*53.7+tAll*10)%BASE_H;ctx.globalAlpha=0.4+0.3*Math.sin(tAll*2+i);ctx.fillStyle="#fff";ctx.fillRect(x,y,2,2);}ctx.globalAlpha=1;
    drawChar("romi",BASE_W/2-40,175,92); drawChar("hachu",BASE_W/2+54,152,58);
    ctx.textAlign="center";ctx.fillStyle="#fff";ctx.font='28px Jua, sans-serif';ctx.textBaseline="middle";
    ctx.fillText("티니핑 어드벤처",BASE_W/2,232);
    ctx.fillStyle="#ffd36b";ctx.font='15px Jua, sans-serif';ctx.fillText("✧ 거울의 성 ✧",BASE_W/2,258);
    const cc=caughtCount(); if(cc>0){ctx.fillStyle="#c9b8e8";ctx.font='12px "Noto Sans KR"';ctx.fillText("도감 "+cc+"/"+catchTargets().length+" · 이어서 A",BASE_W/2,286);}
    if(Math.sin(tAll*3)>-0.3){ctx.fillStyle="#ff9ecf";ctx.font='16px Jua, sans-serif';ctx.fillText("A 버튼을 눌러 시작",BASE_W/2,314);}
    ctx.fillStyle="rgba(255,255,255,.5)";ctx.font='11px "Noto Sans KR"';ctx.fillText("이동 방향키 · A 대화 · 도감 버튼으로 캐치",BASE_W/2,BASE_H-18); }

  function drawEnding(){ const g=ctx.createLinearGradient(0,0,0,BASE_H);g.addColorStop(0,"#ffd9ec");g.addColorStop(0.5,"#c9b0ff");g.addColorStop(1,"#a8e0ff");
    ctx.fillStyle=g;ctx.fillRect(0,0,BASE_W,BASE_H);
    for(let i=0;i<30;i++){ctx.globalAlpha=0.5+0.4*Math.sin(tAll*3+i);ctx.fillStyle=["#fff","#ffd36b","#ff9ecf"][i%3];
      ctx.fillRect((i*61)%BASE_W,(i*47+tAll*14)%BASE_H,3,3);}ctx.globalAlpha=1;
    drawChar("diana",BASE_W/2-52,190,92); drawChar("eclipse",BASE_W/2+52,190,92);
    drawChar("romi",BASE_W/2-8,300,88); drawChar("hachu",BASE_W/2+52,278,52);
    ctx.textAlign="center";ctx.fillStyle="#5a2a7a";ctx.font='26px Jua, sans-serif';ctx.textBaseline="middle";
    ctx.fillText("해피 엔딩 🌈",BASE_W/2,BASE_H-118);
    ctx.font='13px "Noto Sans KR"';ctx.fillStyle="#5a3b6e";
    ctx.fillText("빛과 어둠이 하나로. 자매의 마음이",BASE_W/2,BASE_H-88);
    ctx.fillText("거울의 저주를 부쉈다!",BASE_W/2,BASE_H-68);
    ctx.fillText("하모니 마을에 다시 평화가 찾아왔어.",BASE_W/2,BASE_H-46);
    ctx.fillStyle="#a06fc0";ctx.font='11px "Noto Sans KR"';ctx.fillText("(완주 축하해요! 새로고침하면 처음부터)",BASE_W/2,BASE_H-22); }

  function render(){ ctx.clearRect(0,0,BASE_W,BASE_H);
    if(mode==="title"){drawTitle();return;} if(mode==="opening"){drawOpening();return;}
    if(mode==="battle"){drawBattle();return;} if(mode==="ending"){drawEnding();return;}
    drawField();
    if(mode==="dialog"&&dlg.active)drawDialogBox(dlg.name,dlg.lines[dlg.i].slice(0,Math.floor(dlg.shown))); }
  function loop(ts){ const dt=Math.min(0.05,(ts-last)/1000||0);last=ts;
    if(mode!=="dex")update(dt); render(); requestAnimationFrame(loop); }
  setInterval(()=>{ hintEl.textContent = mode==="battle"?"⚔ 캐치 전투":mode==="dex"?"💛 도감":
    mode==="title"?"티니핑 어드벤처":mode==="opening"?"📖 오프닝":mode==="ending"?"🌈 엔딩":"🗺 하모니 마을 · [도감]으로 캐치"; },300);
  requestAnimationFrame(loop);
})();
</script>
</body>
